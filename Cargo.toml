[package]
name = "peer-board"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
libp2p = { version = "0.56", features = ["tokio", "gossipsub", "mdns", "noise", "identify", "kad", "macros", "tcp", "yamux", "quic"] }
prost = "0.13"
prost-types = "0.13"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = "0.26"
ts-rs = "10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21" 

[build-dependencies]
prost-build = "0.13"
